name: Gradle setup
description: Set up JDK 17, the Gradle build cache, and make gradlew executable.

runs:
  using: composite
  steps:
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Grant execute permission for gradlew
      shell: bash
      run: chmod +x gradlew
